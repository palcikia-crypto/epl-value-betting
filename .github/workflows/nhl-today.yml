name: nhl-today
on:
  schedule:
    - cron: "*/30 * * * *"   # дважды в час
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: generate today.json
        run: node dashboard/today_gen.mjs
      - name: commit
        run: |
          git config user.name "nhl-today bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard/today.json
          if git diff --cached --quiet; then echo no changes; exit 0; fi
          git commit -m "today.json auto-update"
          git push
